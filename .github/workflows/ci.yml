name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # API route modules are evaluated during `next build`; these placeholders
      # are never used to connect to external services in this quality-only job.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/service_portal
      AUTH_SECRET: ci-build-only-secret
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ci
      S3_SECRET_KEY: ci-build-only-secret
      S3_BUCKET: service-portal-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npm run lint
      - run: npm test
      - run: npm run build
