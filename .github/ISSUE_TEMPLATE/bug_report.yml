name: Bug report
description: Report a reproducible problem in Service Portal.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thanks for helping improve Service Portal. Do not include passwords, tokens, or personal data."
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
